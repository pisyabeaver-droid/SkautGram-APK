<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#527da3"><title>SkautGram</title><link rel="stylesheet" href="style.css"></head>
<body><div class="layout" id="layout">
<aside class="sidebar"><header class="sidehead"><button class="iconbtn" id="menuBtn">☰</button><div class="search">⌕ <input id="search" placeholder="Поиск"></div><button class="iconbtn" id="newChat">✎</button></header>
<nav class="folders"><button class="folder active" data-filter="all">Все чаты</button><button class="folder" data-filter="private">Личные</button><button class="folder" data-filter="groups">Группы</button><button class="folder" data-filter="saved">Избранное</button></nav>
<div class="chatlist" id="chatlist"></div><footer class="mybar"><div class="avatar me">S</div><div class="mytext"><b id="myName">SkautGram</b><small id="myHandle">Создать аккаунт</small></div><button class="iconbtn" id="profileBtn">⋮</button></footer></aside>
<main class="main"><header class="top"><button class="iconbtn mobile" id="backBtn">‹</button><div class="avatar" id="currentAvatar">★</div><div class="toptext"><b id="currentTitle">Избранное</b><small id="currentStatus">личные заметки</small></div><button class="iconbtn topicon" id="giftTop">🎁</button><button class="iconbtn topicon" id="moreTop">⋮</button></header>
<section class="messages" id="messages"></section><form class="composer" id="sendForm"><button type="button" class="attach" id="attachBtn">＋</button><input id="messageInput" autocomplete="off" placeholder="Сообщение"><button type="button" class="emoji" id="emojiBtn">☺</button><button class="send">➤</button></form></main></div>
<div class="shade" id="modal" hidden><section class="dialog"><button class="x" id="closeModal">×</button><div class="modalIcon" id="modalIcon">➤</div><h2 id="modalTitle"></h2><p id="modalDesc"></p><div id="modalBody"></div></section></div><div id="toast"></div><script src="app.js"></script></body></html>
